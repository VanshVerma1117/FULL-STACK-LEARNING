<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bubbling</title>
    <style>
      .child {
        background-color: lightseagreen;
        margin: 30px;
        padding: 30px;
        cursor: pointer;
      }
      .child-container {
        background-color: lightcoral;
        margin: 30px;
        padding: 30px;
      }
      .container {
        background-color: rgb(32, 4, 4);
        margin: 30px;
        padding: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="child-container">
        <div class="child">i am a child</div>
      </div>
    </div>
    <script>
      document.querySelector(".child").addEventListener("click", (e) => {
        e.stopPropagation(); //stops event bubbling to parent elements
        alert("Child was clicked");
      }); // when clicking on child , all 3 events will be triggered including the parent events because of event bubbling
      document
        .querySelector(".child-container")
        .addEventListener("click", (e) => {
          alert("Child container was clicked");
        });
      document.querySelector(".container").addEventListener("click", (e) => {
        alert("Container was clicked");
      });

      function getRandomColor() {
        let val1 = Math.ceil(0 + Math.random() * 255);
        let val2 = Math.ceil(0 + Math.random() * 255);
        let val3 = Math.ceil(0 + Math.random() * 255);
        return `rgb(${val1}, ${val2}, ${val3})`;
      }

     let a = setInterval(() => {
        document.querySelector(".child").style.backgroundColor = getRandomColor(); 
      }, 1000);
     let b = setTimeout(() => {
        document.querySelector(".child-container").style.backgroundColor = getRandomColor(); 
      }, 1000); //clearTimeout(b) in console to stop the timeout

      console.log(a); //run clearinterval(a) in console to stop the interval
    </script>
  </body>
</html>
