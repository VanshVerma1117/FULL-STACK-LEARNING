 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM</title>
    <style>
        .box{
            height: 45px;
            width: 45px;
            border: 2px solid black;
            margin: 5px;
            padding: 5px;
        }
        
    </style>
 </head>
 <body>
    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box5">box5</div>
    </div>
    <script src="script.js"></script>
    <script>
      console.log(document.body)
      console.log(document.title)
      document.body.style.backgroundColor = "Green"
      console.log(document.body.childNodes)
      console.log(document.body.childNodes[0])
      let cont = document.body.childNodes[1]
      console.log(cont.firstChild)
      console.log(cont.firstElementChild)
      console.log(cont.lastElementChild.style.color = "red")
      console.log(cont.lastElementChild.style.backgroundColor = "lightblue")
      console.log(cont.lastChild.parentElement)
      console.log(document.body.firstElementChild.childNodes[5].nextElementSibling)
      console.log(document.body.firstElementChild.childNodes[7].previousElementSibling)
    </script>
 </body>
 </html>
