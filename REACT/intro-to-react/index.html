<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REACT</title>
    <style>
        .box{
            color: aqua;
            background-color: blueviolet;
            height: 112px;
            width: 112px;
            border: 2px solid black;
            margin: 5px;
            padding: 3px;
        }
    </style>
</head>
<body>
    <div class="box box1">i am a box1</div>
    <div class="box box2">i am a box2</div>
    <div class="box box3">i am a box3</div>
    <script>
        setTimeout(()=>{
            document.querySelector(".box1").innerHTML = "HEY"
        }, 1000);
        setTimeout(()=>{
            document.querySelector(".box2").innerHTML = "i am changed"
        }, 2000);
        setTimeout(()=>{
            document.querySelector(".box3").innerHTML = "by the help of settimeout()"
        }, 3000);
    </script>
</body>
</html>
